<!-- templates/employees/add_customer.html -->
{% extends 'base.html' %}
{% load static %}
{% load product_extras %}

{% block title %}افزودن مشتری جدید | پنل مدیریت{% endblock %}
{% block extra_head %}
<meta name="robots" content="noindex, nofollow">
{% endblock %}
{% block content %}
<div class="container-custom py-8">
    <div class="max-w-3xl mx-auto">
        <div class="bg-white rounded-xl shadow-sm overflow-hidden">
            <div class="header-primary  px-6 py-4">
                <h1 class="text-2xl font-bold">افزودن مشتری جدید</h1>
                <p class="text-sm opacity-90">اطلاعات مشتری را وارد کنید</p>
            </div>
            
            <form method="post" class="p-6">
                {% csrf_token %}
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">نام *</label>
                        <input type="text" name="first_name" required
                               class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-yellow-500">
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">نام خانوادگی *</label>
                        <input type="text" name="last_name" required
                               class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-yellow-500">
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">کد ملی *</label>
                        <input type="text" name="national_id" required maxlength="10"
                               class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-yellow-500">
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">شماره تلفن *</label>
                        <input type="tel" name="phone" required maxlength="11"
                               class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-yellow-500">
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">ایمیل</label>
                        <input type="email" name="email"
                               class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-yellow-500">
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">شهر</label>
                        <input type="text" name="city"
                               class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-yellow-500">
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">خیابان</label>
                        <input type="text" name="street"
                               class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-yellow-500">
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">اعتبار اولیه (ریال)</label>
                        <input type="number" name="credit" value="0"
                               class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-yellow-500">
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">سطح مشتری</label>
                        <select name="customer_level" class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-yellow-500">
                            <option value="">انتخاب کنید</option>
                            {% for level in customer_levels %}
                            <option value="{{ level.id }}">{{ level.name }} ({{ level.discount_percent }}% تخفیف)</option>
                            {% endfor %}
                        </select>
                    </div>
                    
                    <div class="md:col-span-2">
                        <label class="block text-sm font-medium text-gray-700 mb-2">آدرس کامل</label>
                        <textarea name="address" rows="3"
                                  class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-yellow-500"></textarea>
                    </div>
                </div>
                
                <div class="flex justify-end gap-3 mt-6 pt-4 border-t">
                    <a href="{% url 'employees:manage_customers' %}" class="px-4 py-2 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50">
                        انصراف
                    </a>
                    <button type="submit" class="px-6 py-2 btn-primary rounded-lg">
                        ثبت مشتری
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
